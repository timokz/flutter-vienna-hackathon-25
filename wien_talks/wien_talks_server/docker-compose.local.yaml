services:
  postgres:
    image: postgres:16-trixie
    container_name: postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-local:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "8090:5432"

volumes:
  db-local:
